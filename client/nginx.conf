# A template: ${ACCOUNTS_UPSTREAM}, ${GATEWAY_UPSTREAM} and ${DNS_RESOLVER} are
# filled in from the environment when the container starts.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Look service names up at request time (Docker's DNS by default), not once at
    # boot: nginx starts even if a service isn't up yet, notices replicas being
    # added or replaced, and round-robins across them.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;

    # NOTE: add_header is inherited only by locations that declare no add_header
    # of their own, so the security headers are repeated in each such location.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Liveness probe for Coolify now, Kubernetes later.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Accounts: sign-in, tokens, and the public keys tokens are checked with.
    location /auth/ {
        set $accounts ${ACCOUNTS_UPSTREAM};
        proxy_pass $accounts;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /.well-known/ {
        set $accounts ${ACCOUNTS_UPSTREAM};
        proxy_pass $accounts;
    }

    # ---- Gateway: the live game socket. The Upgrade headers turn the HTTP request
    # into a WebSocket; the long timeout keeps quiet connections open.
    location /socket.io/ {
        set $gateway ${GATEWAY_UPSTREAM};
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite puts a content hash in asset filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # index.html must always be revalidated, or players keep loading old builds.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
